[package]
name = "astronomicon-db"
version.workspace = true
edition.workspace = true

[dependencies]
astronomicon-core = { path = "../astronomicon-core" }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "migrate", "macros"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs"] }
uuid.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = "1.0"
