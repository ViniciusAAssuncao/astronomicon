astronomicon-db = { path = "../astronomicon-db" }
uuid.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "migrate", "macros"] }